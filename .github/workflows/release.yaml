name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing exchanges the OIDC token for a short-lived API key.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Test projects target net11.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Versions are edited by hand in each csproj; the tag must match both.
      - name: Check versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for proj in src/JustBdd/JustBdd.csproj src/JustBdd.Xunit/JustBdd.Xunit.csproj; do
            version=$(dotnet msbuild "$proj" -getProperty:Version)
            if [ "$version" != "$tag" ]; then
              echo "::error file=$proj::Version is $version, but the tag is $GITHUB_REF_NAME."
              exit 1
            fi
          done

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o out

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
