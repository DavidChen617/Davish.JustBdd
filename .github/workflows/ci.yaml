name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Test projects target net11.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build
        id: build
        run: dotnet build -c Release

      # Every test project writes CTRF; projects with Davish.JustBdd also write justbdd-<project>.ctrf.json.
      - name: Test
        run: dotnet test -c Release --no-build --results-directory TestResults --report-xunit-ctrf

      # Exercise the merge tool on each platform, and keep the report even when tests fail.
      - name: Merge reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          dotnet run --project src/JustBdd.Tool -c Release --no-build -- html TestResults -o TestResults/justbdd.html
          test -s TestResults/justbdd.html

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: report-${{ matrix.os }}
          path: TestResults/justbdd.html

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release --no-build -o out

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: out/
